<sc-if value="{{m.isG}}" hint-placeholder-val="{{true}}"><span style="flex: none"><dc-import name="Person" variant="{{m.variant}}" accent="{{m.accent}}" size="36" hint-size="36px,36px"></dc-import></span></sc-if>
<p style="{{m.bubbleStyle}}">{{m.text}}</p>
<sc-if value="{{m.isMe}}" hint-placeholder-val="{{false}}"><span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: {{m.color}}; border: 1.5px solid #1D2A52; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden"><dc-import name="FishArt" kind="{{m.key}}" ink="#FBF6EC" paper="{{m.color}}" size="30" hint-size="30px,20px"></dc-import></span></sc-if>
</div>
</sc-for>
<sc-if value="{{isTyping}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 8px; align-items: flex-end; justify-content: flex-start">
<span style="flex: none"><dc-import name="Person" variant="{{guideVariant}}" accent="{{guideAccent}}" size="36" hint-size="36px,36px"></dc-import></span>
<p aria-label="對方正在輸入" style="margin: 0; padding: 14px 16px; border: 1.5px solid #1D2A52; border-radius: 16px 16px 16px 4px; background: #FBF6EC; display: flex; gap: 5px; align-items: center"><span style="width: 7px; height: 7px; border-radius: 4px; background: #1D2A52; animation: wnzhDot 1.2s infinite"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: #1D2A52; animation: wnzhDot 1.2s 0.15s infinite"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: #1D2A52; animation: wnzhDot 1.2s 0.3s infinite"></span></p>
</div>
</sc-if>
</div>
<div style="padding: 10px 16px 16px; background: #FBF6EC; border-top: 1.5px solid #1D2A52; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{quick}}" as="qr" hint-placeholder-count="3"><button onClick="{{qr.send}}" style="flex: none; height: 38px; padding: 0 14px; border: 1px solid #1D2A52; border-radius: 19px; background: #F2EADB; color: #1D2A52; font-family: inherit; font-size: 13px; cursor: pointer">{{qr.text}}</button></sc-for>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">輸入訊息</label>
<input id="chat-input" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="輸入訊息…" style="flex: 1; height: 46px; border: 1.5px solid #1D2A52; border-radius: 23px; padding: 0 16px; font-family: inherit; font-size: 15px; color: #1D2A52; background: #FFFFFF; box-sizing: border-box">
<button onClick="{{sendDraft}}" aria-label="送出" style="flex: none; width: 46px; height: 46px; border: 0; border-radius: 23px; background: #C8392B; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M5 12 L19 5 L15 19 L12 13 Z" fill="none" stroke="#FBF6EC" stroke-width="2" stroke-linejoin="round"></path></svg></button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isRally}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button onClick="{{goSettings}}" aria-label="返回我的" style="width: 44px; height: 44px; border: 1.5px solid #1D2A52; border-radius: 22px; background: #FBF6EC; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M15 6 L9 12 L15 18" fill="none" stroke="#1D2A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 2px; color: #24408E">STAMP RALLY · 集點</span>
<span style="width: 44px"></span>
</div>
<h2 style="margin: 0; font-size: 26px; font-weight: 900">我的集點與優惠</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 900">{{rallyProgress}}</span><span style="color: #5E5646">集滿兌換限定精美小禮物！</span></div>
<div style="display: flex; gap: 4px"><sc-for list="{{rallySegs}}" as="rs" hint-placeholder-count="6"><span style="{{rs.style}}"></span></sc-for></div>
</div>
<sc-if value="{{rallyDone}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px; align-items: center; padding: 14px; background: #1D2A52; color: #FBF6EC; border-radius: 6px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 900">集滿了！</span><span style="font-size: 12px; line-height: 1.6">回任一租借機台，掃描小卡背面 QR code 兌換獎勵。</span></span>
<button onClick="{{showRentLayer}}" style="flex: none; height: 40px; padding: 0 14px; border: 1.5px solid #FBF6EC; border-radius: 20px; background: transparent; color: #FBF6EC; font-family: inherit; font-size: 13px; cursor: pointer">找機台</button>
</div>
</sc-if>
<div style="flex: none; background-color: #1D2A52; background-image: radial-gradient(#FBF6EC1C 1px, transparent 1.4px); background-size: 8px 8px; padding: 28px 0; display: flex; justify-content: center; border: 1.5px solid #1D2A52">
<dc-import name="StampBack" kind="{{fishKey}}" hole="#1D2A52" collected="{{collectedStr}}" used="{{usedStr}}" hint-size="308px,462px"></dc-import>
</div>
<h3 style="margin: 4px 0 0; font-size: 18px; font-weight: 900">集點站</h3>
<div style="display: flex; flex-direction: column">
<sc-for list="{{rallySpots}}" as="sp" hint-placeholder-count="6">
<div style="display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #CDBFA5">
<span style="{{sp.badgeStyle}}">{{sp.badge}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{sp.title}}</span><span style="font-size: 12px; color: #5E5646">{{sp.hint}}</span></span>
<button onClick="{{sp.toMap}}" style="flex: none; height: 38px; padding: 0 14px; border: 1.5px solid #1D2A52; border-radius: 19px; background: transparent; color: #1D2A52; font-family: inherit; font-size: 13px; cursor: pointer">地圖</button>
</div>
</sc-for>
</div>
<h3 style="margin: 4px 0 0; font-size: 18px; font-weight: 900">我的優惠券</h3>
<sc-for list="{{rallyCoupons}}" as="cp" hint-placeholder-count="2">
<div style="display: flex; border: 1.5px solid #1D2A52; background: #FBF6EC; min-height: 76px">
<span style="flex: none; width: 30px; background: {{cp.bg}}; color: #FBF6EC; writing-mode: vertical-rl; font-size: 12px; font-weight: 900; letter-spacing: 3px; display: flex; align-items: center; justify-content: center">優惠券</span>
<span style="flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1.5px dashed #1D2A52"><span style="font-size: 15px; font-weight: 900">{{cp.title}}</span><span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: 18px; color: {{cp.bg}}">{{cp.value}}</span><span style="font-size: 12px; color: #5E5646">{{cp.note}}</span></span>
<span style="flex: none; width: 92px; display: flex; align-items: center; justify-content: center"><button onClick="{{cp.use}}" style="{{cp.btnStyle}}">{{cp.btnLabel}}</button></span>
</div>
</sc-for>
<p style="margin: 0; font-size: 12px; line-height: 1.7; color: #5E5646">按「使用」模擬攤商掃碼核銷。優惠內容與金額待和合作攤商確認後填入。</p>
</div>
</sc-if>

<sc-if value="{{isSettings}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px; border-bottom: 1.5px solid #1D2A52; padding-bottom: 10px">
<span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 2px; color: #24408E">MY PAGE · 我的</span>
<h2 style="margin: 0; font-size: 28px; font-weight: 900">我的</h2>
</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 16px; background: #FBF6EC; border: 1.5px solid #1D2A52; border-radius: 6px">
<span style="flex: none; width: 68px; height: 68px; border-radius: 34px; background: {{fishColor}}; border: 2px solid #1D2A52; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden"><dc-import name="FishArt" kind="{{fishKey}}" ink="#FBF6EC" paper="{{fishColor}}" size="58" hint-size="58px,39px"></dc-import></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 19px; font-weight: 900">{{profileTitle}}</span>
<span style="font-size: 13px; color: #5E5646">{{profileSub}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column">
<button onClick="{{goRally}}" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>我的集點與優惠</span><span style="font-size: 13px; color: #5E5646">{{rallyProgress}} ›</span></button>
<button onClick="{{goPrint}}" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>我的魚屬性小卡（列印）</span><span style="color: #5E5646">›</span></button>
<button onClick="{{showRentLayer}}" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>租借紀錄</span><span style="font-size: 13px; color: #5E5646">{{rentShort}} ›</span></button>
<button onClick="{{toggleNotify}}" aria-pressed="{{notify}}" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>活動與訊息通知</span><span style="{{trackStyle}}"><span style="{{knobStyle}}"></span></span></button>
<button style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>語言</span><span style="font-size: 13px; color: #5E5646">繁體中文 ›</span></button>
<button onClick="{{startQuiz}}" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>重新測驗魚屬性</span><span style="color: #5E5646">›</span></button>
<button onClick="{{toggleAbout}}" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border: 0; border-bottom: 1px solid #CDBFA5; background: transparent; color: #1D2A52; font-family: inherit; font-size: 15px; cursor: pointer; padding: 0"><span>關於鮪你作伙</span><span style="color: #5E5646">{{aboutArrow}}</span></button>
<sc-if value="{{about}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 12px 0; font-size: 14px; line-height: 1.8; color: #5E5646">鮪你作伙希望讓年輕人透過測驗、配對與在地人帶路，重新認識東港黑鮪魚產業，也讓市場回到連結人與人的城市生活聚點。</p></sc-if>
</div>
